name: Postador Instagram

on:
  schedule:
    - cron: "*/10 * * * *"   # confere a agenda a cada 10 min
  workflow_dispatch:          # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: postador
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publicar posts que chegaram no horário
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FUSO: America/Sao_Paulo
        run: python postador.py

      - name: Salvar resultado (move para publicados/ ou falhas/)
        run: |
          git config user.name "postador-bot"
          git config user.email "postador-bot@users.noreply.github.com"
          git add -A agenda publicados falhas 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "postador: atualiza agenda [skip ci]"
            git pull --rebase
            git push
          fi
